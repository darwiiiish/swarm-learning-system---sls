<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACO - Underground Maze</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Lexend:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app-container">
        <aside class="sidebar">
            <header><h1>ACO <span class="accent">Assignment</span></h1><p>Abdelrahman Mamdouh - 221010901</p></header>
            <div class="control-groups">
                <section class="control-group">
                    <h3>Simulation Speed</h3>
                    <div class="slider-container"><input type="range" id="speed-slider" min="1" max="10" value="2" step="0.5"><span id="speed-value" class="value-badge">2x</span></div>
                </section>
                <section class="control-group">
                    <h3>Food Management</h3>
                    <div class="food-controls"><button id="add-food-btn" class="btn btn-primary">+</button><button id="remove-food-btn" class="btn btn-danger">-</button></div>
                    <p class="hint">Limit: 5 sources</p>
                </section>
                <section class="control-group">
                    <h3>Environment</h3>
                    <div class="slider-container"><label>Ant Population</label><input type="range" id="ant-count" min="10" max="500" value="150"><span id="ant-count-value" class="value-badge">150</span></div>
                    <div class="slider-container"><label>Evaporation Rate (Rho)</label><input type="range" id="evaporation-rate" min="0.001" max="0.5" value="0.001" step="0.001"><span id="evaporation-value" class="value-badge">0.001</span></div>
                </section>
                <section class="control-group">
                    <h3>ACO Parameters</h3>
                    <div class="slider-container"><label>Alpha (Pheromone Weight)</label><input type="range" id="alpha-slider" min="0" max="5" value="1" step="0.1"><span id="alpha-value" class="value-badge">1.0</span></div>
                    <div class="slider-container"><label>Beta (Heuristic Weight)</label><input type="range" id="beta-slider" min="0" max="5" value="2" step="0.1"><span id="beta-value" class="value-badge">2.0</span></div>
                    <div class="slider-container"><label>Q (Pheromone Constant)</label><input type="range" id="q-slider" min="0.1" max="10" value="1" step="0.1"><span id="q-value" class="value-badge">1.0</span></div>
                    <div class="slider-container"><label>Iterations</label><input type="range" id="iter-slider" min="1" max="100" value="20"><span id="iter-value" class="value-badge">20</span></div>
                </section>
                <section class="control-group">
                    <h3>TSP Results</h3>
                    <div id="results-log" class="results-box">
                        <div class="best-dist">Distance: <span id="current-best-dist">--</span></div>
                        <div class="log-entries" id="iter-log">
                            Waiting for solvers...
                        </div>
                    </div>
                </section>
            </div>
            <footer><button id="reset-btn" class="btn btn-secondary">Reset Simulation</button></footer>
        </aside>
        <section class="viewer">
            <div class="canvas-wrapper"><canvas id="aco-canvas"></canvas><div id="loading-overlay" class="overlay"><div class="spinner"></div><p>Burrowing tunnels...</p></div></div>
            <div class="stats"><div class="stat-item"><span class="stat-label">Pheromones</span><div class="progress-bar"><div id="pheromone-progress" style="width:0%"></div></div></div></div>
        </section>

    </main>
    <script src="aco.js"></script>
</body>
</html>
